[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pandaflow"
version = "0.1.0"
description = "Auditable visitor-experience and animal-welfare Skills prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/pandaflow"]

[tool.hatch.build.targets.wheel.force-include]
"resources" = "pandaflow/resources"
"skills" = "pandaflow/skill_docs"
